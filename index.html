<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f23">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="視覺助理">
    <meta name="format-detection" content="telephone=no">
    <title>盲人AI助理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', 'PingFang TC', sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
            /* 瀏海與圓角螢幕的安全區域 */
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        button, select, input { font-family: inherit; }
        button, [role="button"] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        button:focus-visible, [role="button"]:focus-visible {
            outline: 3px solid #ffd166;
            outline-offset: -3px;
        }

        #fileInput { display: none; }

        .config-bar {
            flex: none;
            background: #0f0f23;
            padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .status {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            font-size: 14px;
        }
        #statusText {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .load-btn {
            flex: none;
            min-height: 44px;
            background: #444;
            color: #eee;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            white-space: nowrap;
        }
        .status-dot {
            flex: none;
            width: 10px; height: 10px; border-radius: 50%;
            background: #ff4444;
            display: inline-block;
            margin-right: 6px;
        }
        .status-dot.active { background: #00ff00; }

        .page {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* 主畫面：上方辨識區、中間相機、下方按鈕，依螢幕高度等比分配 */
        .action-zone {
            flex: 1 1 0;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            font-size: clamp(22px, 7vw, 34px);
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.2s;
            text-align: center;
            line-height: 1.4;
        }
        .action-zone:active { opacity: 0.7; }
        .action-zone.disabled { opacity: 0.5; pointer-events: none; }

        .top-zone { background: #7c3aed; color: white; }

        .video-container {
            flex: 1.6 1 0;
            min-height: 160px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        video, canvas { width: 100%; height: 100%; object-fit: contain; }

        .flash {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white; opacity: 0; pointer-events: none;
        }
        .flash.active { opacity: 1; }

        .bottom-zone {
            background: #00d4ff;
            color: #1a1a2e;
            display: flex;
            flex: 1 1 0;
            min-height: 96px;
            gap: 12px;
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        }
        .capture-button {
            flex: 1 1 0;
            min-width: 0;
            border: 0;
            border-radius: 18px;
            padding: 8px;
            background: rgba(255,255,255,0.88);
            color: #1a1a2e;
            font-size: clamp(18px, 6vw, 28px);
            font-weight: bold;
            line-height: 1.3;
            overflow-wrap: anywhere;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
        }
        /* 相機錯誤等長訊息改用較小字級，避免擠出按鈕 */
        .capture-button.message { font-size: clamp(14px, 4vw, 18px); }
        .capture-button:active { transform: scale(0.98); }
        .capture-button.recording {
            background: #ff4d6d;
            color: white;
            animation: pulse 1.2s infinite;
        }
        .capture-button:disabled { opacity: 0.55; cursor: not-allowed; animation: none; }
        .result-text {
            position: absolute;
            left: 12px; right: 12px; bottom: 12px;
            max-height: 45%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: clamp(15px, 4.2vw, 20px);
            line-height: 1.45;
            white-space: pre-wrap;
            display: none;
        }
        .result-text.visible { display: block; }
        @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255,77,109,0.22); } }

        /* 手機橫向：相機在左，操作區在右 */
        @media (orientation: landscape) and (max-height: 600px) {
            #mainPage {
                display: grid;
                grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-areas: "video top" "video bottom";
            }
            .video-container { grid-area: video; min-height: 0; }
            .top-zone { grid-area: top; min-height: 0; font-size: clamp(18px, 4vh + 1vw, 28px); }
            .bottom-zone {
                grid-area: bottom;
                min-height: 0;
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
            }
            .capture-button { font-size: clamp(16px, 4.5vh + 1vw, 24px); }
            .capture-button.message { font-size: clamp(12px, 3vh, 16px); }
            .result-text { max-height: 60%; }
        }

        /* 平板與桌機：限制按鈕字級 */
        @media (min-width: 768px) and (min-height: 700px) {
            .action-zone { font-size: 36px; }
            .capture-button { font-size: 30px; }
        }

        /* 設定頁面 */
        .config-page {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
        }
        .config-inner {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .config-page h1 { font-size: 24px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 18px; font-weight: bold; }
        .field .hint { font-size: 14px; color: #aab; line-height: 1.5; }
        .field select, .field input {
            width: 100%;
            min-height: 48px;
            font-size: 18px; /* 16px 以上可避免 iOS 聚焦時自動放大 */
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid #3a3a5e;
            background: #0f0f23;
            color: #eee;
        }
        .field select:focus, .field input:focus { outline: none; border-color: #00d4ff; }
        .key-row { display: flex; gap: 8px; }
        .key-row input { flex: 1; min-width: 0; }
        .config-actions { display: flex; flex-direction: column; gap: 12px; }
        .big-btn {
            min-height: 56px;
            border: 0;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .big-btn:active { transform: scale(0.98); }
        .big-btn.primary { background: #00d4ff; color: #1a1a2e; }
        .big-btn.secondary { background: #7c3aed; color: white; }
        .big-btn.plain { background: #333355; color: #eee; }
        .config-message {
            min-height: 1.4em;
            font-size: 16px;
            line-height: 1.4;
            color: #ffd166;
        }
        /* 平板以上：操作按鈕兩欄排列 */
        @media (min-width: 600px) {
            .config-actions { display: grid; grid-template-columns: 1fr 1fr; }
            .config-actions .primary, .config-actions #backButton { grid-column: 1 / -1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .capture-button.recording { animation: none; }
            .action-zone, .capture-button { transition: none; }
        }
    </style>
</head>
<body>
    <div class="config-bar">
        <div class="status" role="status" aria-live="polite">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">正在檢查設定...</span>
        </div>
        <button id="configToggle" class="load-btn" type="button" aria-label="開啟設定頁面">⚙️ 設定</button>
    </div>

    <main id="mainPage" class="page">
        <div id="topZone" class="action-zone top-zone disabled" role="button" tabindex="0">
            <span id="topText">辨識並朗讀</span>
        </div>

        <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <div id="flash" class="flash"></div>
            <div id="resultText" class="result-text"></div>
        </div>

        <div id="bottomZone" class="bottom-zone">
            <button id="captureButton" class="capture-button" type="button">📷 拍照</button>
            <button id="recordButton" class="capture-button" type="button">🎙️ 錄音</button>
        </div>
    </main>

    <section id="configPage" class="page config-page" hidden aria-label="設定頁面">
      <div class="config-inner">
        <h1>設定</h1>

        <div class="field">
            <label for="providerSelect">AI 服務</label>
            <select id="providerSelect"></select>
        </div>

        <div class="field">
            <label for="modelInput">模型</label>
            <input id="modelInput" list="modelList" autocomplete="off" autocapitalize="off" spellcheck="false">
            <datalist id="modelList"></datalist>
            <div id="modelHint" class="hint"></div>
        </div>

        <div class="field">
            <label for="apiKeyInput" id="apiKeyLabel">API Key</label>
            <div class="key-row">
                <input id="apiKeyInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="貼上或輸入 API Key">
                <button id="toggleKeyButton" class="load-btn" type="button">顯示</button>
            </div>
            <div id="keySource" class="hint"></div>
        </div>

        <div id="configMessage" class="config-message" role="status" aria-live="polite"></div>

        <div class="config-actions">
            <button id="saveExportButton" class="big-btn primary" type="button">💾 儲存並下載 config.json</button>
            <button id="saveButton" class="big-btn secondary" type="button">✔️ 儲存（不下載）</button>
            <button id="importButton" class="big-btn plain" type="button">📂 匯入 config.json 檔案</button>
            <button id="backButton" class="big-btn plain" type="button">⬅️ 返回主畫面</button>
        </div>
        <input type="file" id="fileInput" accept=".json,application/json">
      </div>
    </section>

<script>
const video = document.getElementById('video');
const videoContainer = document.querySelector('.video-container');
const canvas = document.getElementById('canvas');
const flash = document.getElementById('flash');
const topZone = document.getElementById('topZone');
const topText = document.getElementById('topText');
const captureButton = document.getElementById('captureButton');
const recordButton = document.getElementById('recordButton');
const resultText = document.getElementById('resultText');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const fileInput = document.getElementById('fileInput');
const mainPage = document.getElementById('mainPage');
const configPage = document.getElementById('configPage');
const configToggle = document.getElementById('configToggle');
const providerSelect = document.getElementById('providerSelect');
const modelInput = document.getElementById('modelInput');
const modelList = document.getElementById('modelList');
const modelHint = document.getElementById('modelHint');
const apiKeyInput = document.getElementById('apiKeyInput');
const apiKeyLabel = document.getElementById('apiKeyLabel');
const toggleKeyButton = document.getElementById('toggleKeyButton');
const keySource = document.getElementById('keySource');
const configMessage = document.getElementById('configMessage');

// audio: 'native' = 直接上傳錄音檔，'transcribe' = 先用 Whisper 轉文字，'browser' = 用瀏覽器語音辨識轉文字
const PROVIDERS = {
    gemini: {
        label: 'Gemini (Google)',
        envKey: 'GEMINI_API_KEY',
        model: 'gemini-2.5-flash',
        models: ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.5-pro'],
        audio: 'native',
        hint: 'gemini-2.5-flash 有免費額度。'
    },
    chatgpt: {
        label: 'ChatGPT (OpenAI)',
        envKey: 'OPENAI_API_KEY',
        model: 'gpt-4o-mini',
        models: ['gpt-4o-mini', 'gpt-4.1-mini', 'gpt-4.1-nano', 'gpt-4o'],
        audio: 'transcribe',
        hint: 'OpenAI API 無免費模型，gpt-4o-mini 為低價且支援圖片的模型。錄音以 whisper-1 轉文字。'
    },
    claude: {
        label: 'Claude (Anthropic)',
        envKey: 'ANTHROPIC_API_KEY',
        model: 'claude-haiku-4-5',
        models: ['claude-haiku-4-5', 'claude-sonnet-5', 'claude-opus-5'],
        audio: 'browser',
        hint: 'Claude API 無免費模型，claude-haiku-4-5 為最低價模型。錄音使用瀏覽器語音辨識轉文字。'
    },
    grok: {
        label: 'Grok (xAI)',
        envKey: 'GROK_API_KEY',
        model: 'grok-4-fast-non-reasoning',
        models: ['grok-4-fast-non-reasoning', 'grok-4', 'grok-2-vision-1212'],
        audio: 'browser',
        hint: 'xAI API 無免費模型，grok-4-fast 為低價且支援圖片的模型。錄音使用瀏覽器語音辨識轉文字。'
    }
};
const STORAGE_KEY = 'assistant_config';

// 所有 AI 共用的系統指示：回答問題，而不是轉錄或重複使用者的話
const SYSTEM_PROMPT = '你是語音助理，你的回答會被直接朗讀給使用者聽。請一律用繁體中文簡短、直接地回答使用者的問題或請求。' +
    '當使用者以語音或轉錄文字提問時，請回答問題本身，絕對不要只轉錄、重複或摘要使用者說的話。';
const AUDIO_PROMPT = '這段錄音是使用者對你說的話（問題或請求）。請聽懂內容後直接用繁體中文簡短回答，不要輸出錄音的逐字稿或重複問題。';
const questionPrompt = (text) => `使用者用語音問你：「${text}」\n請直接用繁體中文簡短回答這個問題，不要重複問題。`;

let config = { provider: 'gemini', models: {}, apiKeys: {} };
let configSource = '';
let capturedImage = null;
let recordedAudio = null;
let recordedText = '';
let lastResponse = '';
let cameraState = 'idle';
let cameraAttempt = 0;
let needNewRecognition = false;
let inputMode = null;
let mediaRecorder = null;
let recognition = null;
let audioChunks = [];
let activeUtterance = null;
let speechActive = false;

window.addEventListener('load', () => {
    buildProviderOptions();
    initWebcam();
    loadConfig();
    speak("盲人助理已啟動");
});

// ---------- 設定 ----------

function currentProvider() { return PROVIDERS[config.provider] ? config.provider : 'gemini'; }
function currentModel() { return config.models[currentProvider()] || PROVIDERS[currentProvider()].model; }
function currentKey() { return config.apiKeys[currentProvider()] || ''; }

function isUsableKey(key) {
    return typeof key === 'string' && key.trim() !== '' && !/^paste_/i.test(key.trim());
}

// config.json 以各服務的 key 名稱儲存：GEMINI_API_KEY、OPENAI_API_KEY、ANTHROPIC_API_KEY、GROK_API_KEY
// 相容舊格式 { "apiKey": "..." } 與 { apiKeys: { gemini, chatgpt, claude, grok } }
function normalizeConfig(raw) {
    const cfg = { provider: undefined, models: {}, apiKeys: {} };
    if (!raw || typeof raw !== 'object') return cfg;
    if (PROVIDERS[raw.provider]) cfg.provider = raw.provider;
    const target = cfg.provider || 'gemini';
    for (const id in PROVIDERS) {
        if (isUsableKey(raw.apiKeys?.[id])) cfg.apiKeys[id] = raw.apiKeys[id].trim();
        if (typeof raw.models?.[id] === 'string' && raw.models[id].trim()) cfg.models[id] = raw.models[id].trim();
    }
    if (isUsableKey(raw.apiKey)) cfg.apiKeys[target] = raw.apiKey.trim();
    for (const id in PROVIDERS) {
        const envKey = PROVIDERS[id].envKey;
        if (isUsableKey(raw[envKey])) cfg.apiKeys[id] = raw[envKey].trim();
    }
    if (typeof raw.model === 'string' && raw.model.trim()) cfg.models[target] = raw.model.trim();
    return cfg;
}

function mergeConfig(base, over) {
    return {
        provider: over.provider || base.provider || 'gemini',
        models: { ...base.models, ...over.models },
        apiKeys: { ...base.apiKeys, ...over.apiKeys }
    };
}

function readStoredConfig() {
    try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) return normalizeConfig(JSON.parse(stored));
        // 舊版只存 Gemini key
        const legacyKey = localStorage.getItem('gemini_api_key');
        if (legacyKey) return normalizeConfig({ provider: 'gemini', apiKey: legacyKey });
    } catch (err) { console.warn(err); }
    return normalizeConfig(null);
}

function storeConfig() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(configToJson())); } catch (err) { console.warn(err); }
}

function configToJson() {
    const json = { provider: currentProvider(), model: currentModel() };
    for (const id in PROVIDERS) {
        if (config.apiKeys[id]) json[PROVIDERS[id].envKey] = config.apiKeys[id];
    }
    json.models = { ...config.models };
    return json;
}

// 預設讀取 config.json；使用者在設定頁儲存過的內容優先
async function loadConfig() {
    let fileConfig = null;
    try {
        const response = await fetch('config.json', { cache: 'no-store' });
        if (response.ok) fileConfig = normalizeConfig(await response.json());
    } catch (e) {
        console.warn('Failed to fetch config.json, use manual load');
    }
    const stored = readStoredConfig();
    config = mergeConfig(fileConfig || normalizeConfig(null), stored);

    const fileHasKey = fileConfig && Object.keys(fileConfig.apiKeys).length > 0;
    configSource = fileHasKey ? '已從 config.json 讀取' : (currentKey() ? '已從瀏覽器儲存的設定讀取' : '');
    updateKeyStatus();
    if (fileHasKey) speak('已自動載入設定檔');

    if (!currentKey()) {
        showConfigPage(fileConfig ? 'config.json 內沒有可用的 API Key，請匯入檔案或直接輸入。'
                                  : '找不到 config.json，請匯入檔案或直接輸入 API Key。');
    }
}

function updateKeyStatus() {
    const label = PROVIDERS[currentProvider()].label;
    if (currentKey()) {
        statusDot.classList.add('active');
        statusText.innerText = `${label} · ${currentModel()}`;
    } else {
        statusDot.classList.remove('active');
        statusText.innerText = `${label}：請到設定輸入 API Key`;
    }
}

function buildProviderOptions() {
    providerSelect.innerHTML = '';
    for (const [id, p] of Object.entries(PROVIDERS)) {
        const option = document.createElement('option');
        option.value = id;
        option.textContent = p.label;
        providerSelect.appendChild(option);
    }
}

// 設定頁表單顯示指定 provider 的模型與 key
function fillConfigForm(provider) {
    const p = PROVIDERS[provider];
    providerSelect.value = provider;
    modelInput.value = config.models[provider] || p.model;
    modelList.innerHTML = p.models.map(m => `<option value="${m}"></option>`).join('');
    modelHint.textContent = `預設：${p.model}。${p.hint}`;
    apiKeyLabel.textContent = `API Key（${p.envKey}）`;
    apiKeyInput.value = config.apiKeys[provider] || '';
    keySource.textContent = config.apiKeys[provider]
        ? (provider === currentProvider() && configSource ? configSource : '已儲存')
        : '尚未設定';
}

function showConfigPage(message) {
    stopRecording();
    fillConfigForm(currentProvider());
    configMessage.textContent = message || '';
    mainPage.hidden = true;
    configPage.hidden = false;
    configToggle.textContent = '⬅️ 返回';
    configToggle.setAttribute('aria-label', '返回主畫面');
    speak(message ? `設定頁面。${message}` : '設定頁面');
}

function showMainPage() {
    configPage.hidden = true;
    mainPage.hidden = false;
    configToggle.textContent = '⚙️ 設定';
    configToggle.setAttribute('aria-label', '開啟設定頁面');
    speak('主畫面');
}

configToggle.addEventListener('click', () => {
    if (configPage.hidden) showConfigPage();
    else showMainPage();
});
document.getElementById('backButton').addEventListener('click', showMainPage);

providerSelect.addEventListener('change', () => {
    fillConfigForm(providerSelect.value);
    configMessage.textContent = '';
    speak(PROVIDERS[providerSelect.value].label);
});

toggleKeyButton.addEventListener('click', () => {
    const show = apiKeyInput.type === 'password';
    apiKeyInput.type = show ? 'text' : 'password';
    toggleKeyButton.textContent = show ? '隱藏' : '顯示';
});

function applyConfigForm() {
    const provider = providerSelect.value;
    const key = apiKeyInput.value.trim();
    const model = modelInput.value.trim();
    if (!isUsableKey(key)) {
        configMessage.textContent = '請輸入 API Key';
        speak('請輸入 API Key');
        return false;
    }
    const previousAudioMode = PROVIDERS[currentProvider()].audio;
    config.provider = provider;
    config.apiKeys[provider] = key;
    if (model && model !== PROVIDERS[provider].model) config.models[provider] = model;
    else delete config.models[provider];
    configSource = '已儲存';
    storeConfig();
    updateKeyStatus();
    // 換了 AI 之後要重新辨識；錄音格式不相容時需重錄
    needNewRecognition = true;
    if (inputMode === 'audio' && (previousAudioMode === 'browser') !== (PROVIDERS[provider].audio === 'browser')) {
        clearRecording();
    }
    return true;
}

document.getElementById('saveButton').addEventListener('click', () => {
    if (!applyConfigForm()) return;
    configMessage.textContent = '設定已儲存';
    speak('設定已儲存');
});

document.getElementById('saveExportButton').addEventListener('click', async () => {
    if (!applyConfigForm()) return;
    try {
        const saved = await exportConfigFile();
        configMessage.textContent = saved ? '設定已儲存，並已下載 config.json' : '設定已儲存，未下載檔案';
        speak(saved ? '設定已儲存並下載' : '設定已儲存');
    } catch (err) {
        console.error(err);
        configMessage.textContent = '設定已儲存，但下載 config.json 失敗';
        speak('下載設定檔失敗');
    }
});

// 儲存 config.json 到本機：支援「另存新檔」的瀏覽器讓使用者選位置，其餘（含手機）以下載方式存到下載資料夾
async function exportConfigFile() {
    const blob = new Blob([JSON.stringify(configToJson(), null, 2)], { type: 'application/json' });
    if (window.showSaveFilePicker) {
        try {
            const handle = await window.showSaveFilePicker({
                suggestedName: 'config.json',
                types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
            });
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            return true;
        } catch (err) {
            if (err.name === 'AbortError') return false;
            console.warn('showSaveFilePicker failed, fallback to download', err);
        }
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'config.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
}

document.getElementById('importButton').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    fileInput.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        try {
            const imported = normalizeConfig(JSON.parse(event.target.result));
            if (!Object.keys(imported.apiKeys).length) {
                configMessage.textContent = '檔案內沒有可用的 API Key';
                speak('檔案內沒有可用的 API Key');
                return;
            }
            config = mergeConfig(config, imported);
            configSource = '已從匯入的檔案讀取';
            storeConfig();
            updateKeyStatus();
            needNewRecognition = true;
            fillConfigForm(currentProvider());
            configMessage.textContent = '設定檔匯入成功';
            speak('設定檔載入成功');
        } catch (err) {
            configMessage.textContent = '設定檔格式錯誤';
            speak('設定檔格式錯誤');
        }
    };
    reader.readAsText(file);
});

// ---------- 語音 ----------

function speak(text, onDone) {
    let finished = false;
    const done = () => { if (!finished) { finished = true; onDone?.(); } };
    if (!text || !window.speechSynthesis || !window.SpeechSynthesisUtterance) { done(); return; }
    try {
        window.speechSynthesis.cancel();
        speechActive = false;
        const utterance = new SpeechSynthesisUtterance(text);
        activeUtterance = utterance;
        utterance.lang = 'zh-TW';
        utterance.onstart = () => {
            if (activeUtterance === utterance) speechActive = true;
        };
        utterance.onend = utterance.onerror = () => {
            if (activeUtterance === utterance) {
                speechActive = false;
                activeUtterance = null;
            }
            done();
        };
        window.speechSynthesis.speak(utterance);
        // 部分瀏覽器不會觸發 onend
        if (onDone) setTimeout(done, 2500);
    } catch (err) { console.warn('Speech unavailable:', err); done(); }
}

function stopSpeaking() {
    if (!speechActive && !window.speechSynthesis?.speaking && !window.speechSynthesis?.pending) return;
    window.speechSynthesis.cancel();
    speechActive = false;
    activeUtterance = null;
}

// The captured image/video area is the large, easy-to-reach stop-speaking target.
videoContainer.addEventListener('pointerup', stopSpeaking);

// ---------- 相機 ----------

function setCameraState(state, message) {
    cameraState = state;
    const isMessage = state === 'error' || state === 'starting';
    captureButton.classList.toggle('message', isMessage);
    if (isMessage) captureButton.textContent = `📷 ${message}`;
    else if (state === 'ready' && !isRecording()) captureButton.textContent = '📷 拍照';
}

function showResult(text) {
    resultText.textContent = text || '';
    resultText.classList.toggle('visible', !!text);
}

async function initWebcam() {
    if (cameraState === 'starting') return;
    const attempt = ++cameraAttempt;
    setCameraState('starting', '相機準備中，請允許相機權限');
    let stream;
    let timer;
    let cancelFrameWait = () => {};
    try {
        if (!window.isSecureContext) {
            throw new Error('請使用 HTTPS 或 localhost 開啟此頁面');
        }
        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error('此瀏覽器不支援相機，請使用支援相機的瀏覽器');
        }
        const startup = async () => {
            stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            // A permission prompt can resolve after the startup timeout.
            if (attempt !== cameraAttempt) {
                stream.getTracks().forEach(track => track.stop());
                return;
            }
            video.srcObject = stream;
            video.muted = true;
            await video.play();
            if (attempt !== cameraAttempt) return;
            if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
                await new Promise(resolve => {
                    const checkFrame = () => {
                        if (video.readyState >= 2 && video.videoWidth && video.videoHeight) {
                            cancelFrameWait();
                            resolve();
                        }
                    };
                    const poll = setInterval(checkFrame, 100);
                    cancelFrameWait = () => { clearInterval(poll); resolve(); };
                    checkFrame();
                });
            }
        };
        await Promise.race([
            startup(),
            new Promise((_, reject) => {
                timer = setTimeout(() => reject(new Error('相機啟動逾時，請確認相機權限後點此重試')), 15000);
            })
        ]);
        setCameraState('ready', '拍 照');
    } catch (err) {
        ++cameraAttempt;
        if (stream) stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        const messages = {
            NotAllowedError: '相機權限或播放被封鎖，請允許相機後點此重試',
            NotFoundError: '找不到相機，請連接相機後點此重試',
            NotReadableError: '無法讀取相機，請關閉其他使用相機的程式後點此重試',
            OverconstrainedError: '相機不支援所需設定，請換一台相機後點此重試'
        };
        const message = messages[err.name] || err.message || '相機啟動失敗，點此重試';
        setCameraState('error', message);
        console.error(err);
        speak(message);
    } finally {
        clearTimeout(timer);
        cancelFrameWait();
    }
}

captureButton.addEventListener('click', () => {
    if (isRecording()) {
        speak('請先停止錄音');
        return;
    }
    if (cameraState === 'starting') {
        speak('請允許瀏覽器使用相機，或等待啟動結果');
        return;
    }
    if (cameraState !== 'ready' || video.readyState < 2 ||
        !video.videoWidth || !video.videoHeight ||
        !video.srcObject?.active) {
        if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
        initWebcam();
        return;
    }

    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 100);

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    // 轉換成 Base64
    capturedImage = canvas.toDataURL('image/jpeg', 0.8);
    recordedAudio = null;
    recordedText = '';
    inputMode = 'image';
    needNewRecognition = true;
    topZone.classList.remove('disabled');
    topText.innerHTML = "辨識並朗讀";
    showResult('照片已準備好，按上方按鈕送出');
    speak('已拍照');
});

// ---------- 錄音 ----------

function isRecording() {
    return mediaRecorder?.state === 'recording' || !!recognition;
}

function setRecordingUI(on) {
    recordButton.classList.toggle('recording', on);
    recordButton.textContent = on ? '⏹️ 停止錄音' : (inputMode === 'audio' ? '🎙️ 重新錄音' : '🎙️ 錄音');
}

function stopRecording() {
    if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
    if (recognition) recognition.stop();
}

function clearRecording() {
    recordedAudio = null;
    recordedText = '';
    if (inputMode === 'audio') {
        inputMode = null;
        topZone.classList.add('disabled');
        topText.textContent = '辨識並朗讀';
        showResult('');
    }
    setRecordingUI(false);
}

function onAudioReady(blob, text) {
    recordedAudio = blob || null;
    recordedText = text || '';
    inputMode = 'audio';
    capturedImage = null;
    needNewRecognition = true;
    topZone.classList.remove('disabled');
    topText.textContent = '轉錄、回答並朗讀';
    setRecordingUI(false);
    showResult(text ? `你說：${text}\n按上方按鈕送出` : '錄音已準備好，按上方按鈕送出');
    speak('錄音完成');
}

recordButton.addEventListener('click', async () => {
    if (isRecording()) {
        stopRecording();
        return;
    }
    if (PROVIDERS[currentProvider()].audio === 'browser') startSpeechRecognition();
    else startMediaRecorder();
});

async function startMediaRecorder() {
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        speak('此瀏覽器不支援錄音');
        return;
    }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = event => { if (event.data.size) audioChunks.push(event.data); };
        mediaRecorder.onstop = () => {
            const mimeType = (mediaRecorder.mimeType || 'audio/webm').split(';')[0];
            stream.getTracks().forEach(track => track.stop());
            onAudioReady(new Blob(audioChunks, { type: mimeType }), '');
        };
        mediaRecorder.start();
        setRecordingUI(true);
        showResult('正在錄音…');
        speak('開始錄音');
    } catch (err) {
        console.error('Audio error:', err);
        speak('無法使用麥克風，請允許麥克風權限');
    }
}

// Claude / Grok 不接受音訊輸入，改用瀏覽器語音辨識轉成文字
function startSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        speak('此瀏覽器不支援語音辨識，請改用 Gemini 或 ChatGPT');
        return;
    }
    const rec = new SpeechRecognition();
    recognition = rec;
    rec.lang = 'zh-TW';
    rec.continuous = true;
    rec.interimResults = true;
    let finalText = '';
    let interimText = '';
    rec.onresult = (event) => {
        interimText = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            if (result.isFinal) finalText += result[0].transcript;
            else interimText += result[0].transcript;
        }
        showResult(`正在聆聽…\n${finalText}${interimText}`);
    };
    rec.onerror = (event) => {
        console.warn('Speech recognition error:', event.error);
        if (event.error === 'not-allowed') speak('無法使用麥克風，請允許麥克風權限');
    };
    rec.onend = () => {
        if (recognition !== rec) return;
        recognition = null;
        const text = (finalText + interimText).trim();
        if (text) {
            onAudioReady(null, text);
        } else {
            setRecordingUI(false);
            showResult('');
            speak('沒有聽到內容，請重新錄音');
        }
    };
    setRecordingUI(true);
    showResult('正在聆聽…');
    // 等提示語說完再開始聽，避免把提示語辨識進去
    speak('開始錄音', () => {
        if (recognition !== rec) return;
        try { rec.start(); } catch (err) {
            console.error(err);
            recognition = null;
            setRecordingUI(false);
            speak('語音辨識啟動失敗');
        }
    });
}

// ---------- 呼叫 AI ----------

// 上方辨識區是 div，補上鍵盤（外接鍵盤、讀屏軟體）操作
topZone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        topZone.click();
    }
});

topZone.addEventListener('click', async () => {
    if (!currentKey()) { speak('請先在設定頁面輸入 API Key'); showConfigPage(); return; }
    if (isRecording()) { speak('請先停止錄音'); return; }
    if (!inputMode) { speak('請先拍照或錄音'); return; }
    if (inputMode === 'image' && !capturedImage) { speak('請先拍照'); return; }
    if (inputMode === 'audio' && !recordedAudio && !recordedText) { speak('請先錄音'); return; }
    if (!needNewRecognition && lastResponse) { speak(lastResponse); return; }

    topZone.classList.add('disabled');
    topText.innerHTML = inputMode === 'audio' ? "轉錄與分析中..." : "分析中...";
    speak(inputMode === 'audio' ? '正在轉錄與分析' : '正在分析');

    try {
        let request;
        if (inputMode === 'image') {
            request = {
                prompt: '請用繁體中文簡短回答這張照片的內容',
                image: { mime: 'image/jpeg', data: capturedImage.split(',')[1] }
            };
        } else if (recordedText) {
            request = { prompt: questionPrompt(recordedText) };
        } else {
            request = { prompt: AUDIO_PROMPT, audio: recordedAudio };
        }

        lastResponse = await queryAI(request) || '辨識不到內容';
        needNewRecognition = false;
        topText.innerHTML = "再次朗讀";
        showResult(lastResponse);
        speak(lastResponse);
    } catch (err) {
        console.error("Fetch Error:", err);
        showResult(`錯誤：${err.message}`);
        speak('辨識失敗，請檢查網路或 API 金鑰');
        topText.innerHTML = "重試";
    } finally {
        topZone.classList.remove('disabled');
    }
});

// request: { prompt, image?: {mime, data}, audio?: Blob }，回傳文字
async function queryAI(request) {
    const provider = currentProvider();
    const key = currentKey();
    const model = currentModel();
    if (provider === 'gemini') return queryGemini(request, key, model);
    if (provider === 'claude') return queryClaude(request, key, model);
    if (provider === 'chatgpt') {
        if (request.audio) {
            const text = await transcribeOpenAI(request.audio, key);
            if (!text) return '';
            request = { prompt: questionPrompt(text) };
        }
        return queryOpenAICompatible('https://api.openai.com/v1/chat/completions', request, key, model);
    }
    if (provider === 'grok') return queryOpenAICompatible('https://api.x.ai/v1/chat/completions', request, key, model);
    throw new Error(`未知的 AI 服務：${provider}`);
}

async function postJson(url, headers, body) {
    const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...headers },
        body: JSON.stringify(body)
    });
    return readResponse(response);
}

async function readResponse(response) {
    let data = null;
    try { data = await response.json(); } catch (err) { /* 非 JSON 回應 */ }
    if (!response.ok || data?.error) {
        console.error('API Error:', data?.error || response.status);
        const message = data?.error?.message || (typeof data?.error === 'string' ? data.error : '') || `HTTP ${response.status}`;
        throw new Error(message);
    }
    return data;
}

async function queryGemini(request, key, model) {
    // 媒體放在前、指示放在後，Gemini 才會針對內容回答而不是只轉錄
    const parts = [];
    if (request.image) parts.push({ inline_data: { mime_type: request.image.mime, data: request.image.data } });
    if (request.audio) {
        parts.push({ inline_data: {
            mime_type: (request.audio.type || 'audio/webm').split(';')[0],
            data: await blobToBase64(request.audio)
        } });
    }
    parts.push({ text: request.prompt });
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    const data = await postJson(url, { 'x-goog-api-key': key }, {
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [{ role: 'user', parts }]
    });
    return data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('').trim();
}

// ChatGPT 與 Grok 使用相同的 chat completions 格式
async function queryOpenAICompatible(url, request, key, model) {
    const content = [{ type: 'text', text: request.prompt }];
    if (request.image) {
        content.push({ type: 'image_url', image_url: { url: `data:${request.image.mime};base64,${request.image.data}` } });
    }
    const data = await postJson(url, { Authorization: `Bearer ${key}` }, {
        model,
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, { role: 'user', content }]
    });
    return data.choices?.[0]?.message?.content?.trim();
}

async function transcribeOpenAI(blob, key) {
    const mime = (blob.type || 'audio/webm').split(';')[0];
    const ext = { 'audio/mp4': 'm4a', 'audio/mpeg': 'mp3', 'audio/ogg': 'ogg', 'audio/wav': 'wav' }[mime] || 'webm';
    const form = new FormData();
    form.append('file', blob, `audio.${ext}`);
    form.append('model', 'whisper-1');
    const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST',
        headers: { Authorization: `Bearer ${key}` },
        body: form
    });
    const data = await readResponse(response);
    return (data.text || '').trim();
}

async function queryClaude(request, key, model) {
    const content = [];
    if (request.image) {
        content.push({ type: 'image', source: { type: 'base64', media_type: request.image.mime, data: request.image.data } });
    }
    content.push({ type: 'text', text: request.prompt });
    const data = await postJson('https://api.anthropic.com/v1/messages', {
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
    }, {
        model,
        max_tokens: 1024,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content }]
    });
    if (data.stop_reason === 'refusal') return '無法回答這個問題';
    return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
}

function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}
